<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada — Jane Sartor</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;
    background:linear-gradient(165deg,#FAF5EF 0%,#F4EBE0 50%,#F2E3E3 100%);color:#6B5A4B;font-family:'Jost',sans-serif;font-weight:300}
  .n{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(4.5rem,16vw,8rem);color:#B9A6C4;line-height:1}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(1.8rem,5vw,2.6rem);color:#8A6F58;margin:1rem 0 .8rem}
  p{max-width:26rem;margin:0 auto 2rem;line-height:1.7}
  a{display:inline-block;padding:1rem 2.3rem;border-radius:999px;text-decoration:none;color:#fff;font-weight:500;
    font-size:.86rem;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid #574468;
    background:linear-gradient(180deg,#8C74A2,#7B6391 52%,#6A5480);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 10px 22px -10px rgba(87,68,104,.7)}
  a:focus-visible{outline:3px solid #574468;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <div class="n">404</div>
    <h1>Essa página não existe.</h1>
    <p>Talvez o endereço tenha mudado. Você pode voltar ao início e continuar de onde parou.</p>
    <a href="/">Voltar ao início</a>
  </main>
</body>
</html>
